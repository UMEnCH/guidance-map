<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 260" font-family="-apple-system,Hiragino Kaku Gothic ProN,Hiragino Sans,sans-serif" fill="none" stroke-linecap="round" stroke-linejoin="round"><style>.t{fill:#1c1c1e;font-size:15px;stroke:none}.s{fill:#636366;font-size:12px;stroke:none}.b{fill:#0a84ff;font-size:14px;font-weight:700;stroke:none}.r{fill:#d70015;font-size:14px;font-weight:700;stroke:none}.g{fill:#248a3d;font-size:14px;font-weight:700;stroke:none}.ax{stroke:#8e8e93;stroke-width:1.5}</style>
<line x1="40" y1="120" x2="530" y2="120" stroke="#30d158" stroke-width="3"/>
<g fill="#30d158" stroke="none"><circle cx="60" cy="120" r="8"/><circle cx="190" cy="120" r="8"/><circle cx="330" cy="120" r="8"/><circle cx="480" cy="120" r="8"/></g>
<text class="g" x="40" y="95">やめた直後</text><text class="s" x="40" y="150">血圧・脈拍が</text><text class="s" x="40" y="168">落ち着く</text>
<text class="g" x="160" y="95">数週〜数か月</text><text class="s" x="160" y="150">せき・息切れが</text><text class="s" x="160" y="168">改善していく</text>
<text class="g" x="300" y="95">1年〜</text><text class="s" x="300" y="150">心臓病の</text><text class="s" x="300" y="168">リスクが下がる</text>
<text class="g" x="440" y="95">年単位</text><text class="s" x="440" y="150">脳卒中・がんの</text><text class="s" x="440" y="168">リスクが下がる</text>
<text class="t" x="40" y="45">禁煙はどの年齢から始めても効果がある</text>
<text class="s" x="40" y="225">周りの人の受動喫煙もなくなる</text>
</svg>
